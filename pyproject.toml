[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pci-realtime"
version = "0.1.0"
description = "Real-time Policy Credibility Index monitor for IRA provisions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yikai Cao lab" }
]
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.1",
  "httpx>=0.27",
  "openai>=1.40",
  "cryptography>=42.0",
  "pandas>=2.2",
  "pyarrow>=16.1",
  "PyYAML>=6.0",
  "python-dateutil>=2.9",
  "requests>=2.32",
  "tenacity>=9.0",
  "typer>=0.12",
  "rich>=13.7",
  "mcp[cli]>=1.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pci = "pci_realtime.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
