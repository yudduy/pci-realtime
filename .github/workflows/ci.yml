name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          # Tests should not require real API keys; integration tests that do
          # are gated on these being set and skipped otherwise.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PROPUBLICA_CONGRESS_API_KEY: ""
          FEDERAL_REGISTER_USER_AGENT: "pci-realtime-ci/0.1 (ci@github)"
        run: |
          pytest tests/ -v --tb=short

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/pci_realtime
      - name: Format check
        run: ruff format --check src/pci_realtime
