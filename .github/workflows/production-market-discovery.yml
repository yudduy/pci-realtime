name: Production Market Discovery

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the discovery payload without writing Supabase."
        required: false
        default: false
        type: boolean
      include_all_candidates:
        description: "Persist every scanned public market candidate, not just near matches."
        required: false
        default: false
        type: boolean
      polymarket_limit:
        description: "Maximum Polymarket active events to scan."
        required: false
        default: "1000"
  schedule:
    - cron: "35 */6 * * *"

concurrency:
  group: production-market-discovery
  cancel-in-progress: false

jobs:
  discovery:
    name: Scan public market venues
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      INCLUDE_ALL_CANDIDATES: ${{ github.event.inputs.include_all_candidates || 'false' }}
      POLYMARKET_LIMIT: ${{ github.event.inputs.polymarket_limit || '1000' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and runtime
        run: |
          python -m pip install --upgrade pip uv
          uv sync --extra dev

      - name: Verify production secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Run market discovery
        run: |
          args=(
            --polymarket-limit "$POLYMARKET_LIMIT"
          )
          if [[ "$INCLUDE_ALL_CANDIDATES" == "true" ]]; then
            args+=(--include-all-candidates)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run --output-path data/debug/market_discovery_payload.json)
          fi
          uv run --extra dev python -m pci_realtime.pipeline.market_discovery "${args[@]}"
