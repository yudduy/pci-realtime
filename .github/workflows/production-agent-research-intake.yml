name: Production Agent Evidence Intake

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Submit evidence through Agent COI intake."
        required: false
        default: false
        type: boolean
      since:
        description: "Earliest source date to search, YYYY-MM-DD. Defaults to last 14 days."
        required: false
  schedule:
    # Daily evidence scout. Writes only after Agent COI migration 005 is live.
    - cron: "25 15 * * *"

concurrency:
  group: production-agent-research-intake
  cancel-in-progress: false

jobs:
  research-intake:
    name: Search official sources and submit cited evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WRITE: ${{ github.event.inputs.write || 'false' }}
      SINCE: ${{ github.event.inputs.since || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and runtime
        run: |
          python -m pip install --upgrade pip uv
          uv sync --extra dev

      - name: Verify production secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$OPENAI_API_KEY"

      - name: Search and optionally submit evidence
        run: |
          args=(
            --output-path data/debug/agent_research_intake.json
          )
          if [[ -n "$SINCE" ]]; then
            args+=(--since "$SINCE")
          fi
          if [[ "$WRITE" == "true" ]]; then
            args+=(--write)
          fi
          uv run --extra dev python scripts/run_agent_research_intake.py "${args[@]}"
