name: Production Registry Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to ingest, YYYY-MM-DD. Defaults to previous complete week."
        required: false
      end_date:
        description: "Last date to ingest, YYYY-MM-DD. Defaults to previous complete week."
        required: false
      dry_run:
        description: "Build the payload without writing Supabase."
        required: false
        default: false
        type: boolean
  schedule:
    # Finalize the previous complete week.
    - cron: "15 14 * * 1"
    # Rolling live ingest for the current week-to-date on Federal Register
    # publication days. This runs the full e2e loop: ingest, score, market
    # match, forecast, proposal gate, and publish.
    - cron: "15 20 * * 1-5"

concurrency:
  group: production-registry-pipeline
  cancel-in-progress: false

jobs:
  registry:
    name: Ingest, score, forecast, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROPUBLICA_CONGRESS_API_KEY: ${{ secrets.PROPUBLICA_CONGRESS_API_KEY }}
      FEDERAL_REGISTER_USER_AGENT: ${{ vars.FEDERAL_REGISTER_USER_AGENT || 'pci-realtime-production/0.1' }}
      PCI_LLM_PROVIDER: openai
      PCI_SCREENING_PROVIDER: openai
      PCI_SCREENING_MODEL: ${{ vars.PCI_SCREENING_MODEL || 'gpt-5.4-nano' }}
      PCI_SCORING_PROVIDER: openai
      PCI_SCORING_MODEL: ${{ vars.PCI_SCORING_MODEL || 'gpt-5.4-mini' }}
      PCI_AUDIT_PROVIDER: openai
      PCI_AUDIT_MODEL: ${{ vars.PCI_AUDIT_MODEL || 'gpt-5.5' }}
      INPUT_START_DATE: ${{ github.event.inputs.start_date || '' }}
      INPUT_END_DATE: ${{ github.event.inputs.end_date || '' }}
      TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and runtime
        run: |
          python -m pip install --upgrade pip uv
          uv sync --extra dev

      - name: Resolve ingest date window
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import date, timedelta

          today = date.today()
          this_monday = today - timedelta(days=today.weekday())
          if os.environ.get("TRIGGER_SCHEDULE") == "15 20 * * 1-5":
              default_start = this_monday
              default_end = today
          else:
              default_start = this_monday - timedelta(days=7)
              default_end = this_monday - timedelta(days=1)
          start = os.environ.get("INPUT_START_DATE") or default_start.isoformat()
          end = os.environ.get("INPUT_END_DATE") or default_end.isoformat()
          print(f"START_DATE={start}")
          print(f"END_DATE={end}")
          PY

      - name: Verify production secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$OPENAI_API_KEY"
          test -n "$PROPUBLICA_CONGRESS_API_KEY"

      - name: Seed paper anchors
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            uv run --extra dev python -m pci_realtime.pipeline.seed_supabase --dry-run
          else
            uv run --extra dev python -m pci_realtime.pipeline.seed_supabase
          fi

      - name: Run full weekly registry loop
        run: |
          args=(
            --start-date "$START_DATE"
            --end-date "$END_DATE"
            --confirm-cost
            --fetch-markets
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run --output-path data/debug/weekly_live_payload.json)
          fi
          uv run --extra dev python -m pci_realtime.pipeline.weekly_live "${args[@]}"
